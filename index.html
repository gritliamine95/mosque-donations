
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <title>جمع التبرعات</title>
  <link rel="stylesheet" href="styles.css" />

<body class="bg-mosque1">
  <header class="topbar">

    <nav class="nav">
      <a class="btn" href="add.html">➕ إضافة تبرع</a>

  <main class="layout">
    <!-- Colonne principale (gauche) -->
    <section class="hero">
      <p class="hero-text">
        <span id="totalAmount" class="number"></span>
      </p>
    </section>

    <!-- Panneau (droite) -->
    <aside class="sidebar card">
      <!-- Encadré des 2 plus grands dons -->
      <div class="top-donations">
        <h3 class="top-title">🏆 أكبر التبرعات</h3>
        
        <ul id="topTwoList" class="top-list"></ul>
      </div>

      <!-- Séparateur visuel -->
      <hr class="sep" />
      
      <!-- 10 derniers dons (compteur: 1 = أقدم, العدد الأكبر = أحدث) -->

      <ul id="lastTenList" class="list"></ul>

<!-- 1) Initialisation Firebase (AVANT app.js) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ⚠️ Remplace par ta vraie config du projet Firebase
  const firebaseConfig = {
      apiKey: "AIzaSyBykFFJT2cF7_pVu4aPSQqy_ucu9GdnJt8",
      authDomain: "mosque-receipts.firebaseapp.com",
      projectId: "mosque-receipts",
      storageBucket: "mosque-receipts.firebasestorage.app",
      messagingSenderId: "573456225416",
      appId: "1:573456225416:web:8e266a8802e4baaf94bb3d",
      measurementId: "G-SPZR44XBHD"
    };

  // Expose Firebase pour app.js
  window._fb = {};
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Promise résolue dès que l’auth anonyme est prête
  window._fb.db = db;
  window._fb.authReady = new Promise((resolve, reject) => {
    signInAnonymously(auth).catch((e) => {
      console.error('[Auth] signInAnonymously error:', e);
      reject(e);
    });
    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log('[Auth] Anonymous signed in:', user.uid);
        resolve(user);
      }
    }, (e) => {
      console.error('[Auth] onAuthStateChanged error:', e);
      reject(e);
    });
  });

  console.log('[Firebase] initialized');
</script>




  <script src="app.js"></script>
</body>
</html>
