
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  
<script>
  (function () {
    // Si la marque d’accès n’existe pas → retour vers l’accueil
    if (sessionStorage.getItem("canAddDonation") !== "1") {
      // Optionnel: message
      alert("الوصول ممنوع: تحتاج كلمة المرور لإضافة تبرع.");
      window.location.replace("index.html");
    }
  })();
</script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إضافة تبرع</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-mosque">
  <header class="topbar">
    <div class="title"></div>
    <nav class="nav">
      <a class="btn btn-secondary" href="index.html">⬅ العودة</a>
    </nav>
  </header>

  <main class="container">
    <section class="card" style="max-width: 520px;">
      <form id="donForm" class="form">
        <div class="field">
          <label for="amount">المبلغ (€) <span class="req">*</span></label>
          <input type="number" id="amount" name="amount" step="0.01" min="0" required placeholder="مثال: 50" />
        </div>

        <div class="field">
          <label for="name">اسم المُتبرِّع (اختياري)</label>
          <input type="text" id="name" name="name" placeholder="مثال: أحمد بن علي" />
        </div>

        <div class="actions">
          <button type="submit" class="btn">💾 حفظ</button>
          <a class="btn btn-secondary" href="index.html">إلغاء</a>
        </div>

        <div id="saveMessage" class="success" style="display:none;">تم الحفظ ✅</div>
      </form>
    </section>
  </main>

  <!-- 1) Initialisation Firebase (AVANT app.js) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ⚠️ Remplace par ta vraie config du projet Firebase
  const firebaseConfig = {
      apiKey: "AIzaSyBykFFJT2cF7_pVu4aPSQqy_ucu9GdnJt8",
      authDomain: "mosque-receipts.firebaseapp.com",
      projectId: "mosque-receipts",
      storageBucket: "mosque-receipts.firebasestorage.app",
      messagingSenderId: "573456225416",
      appId: "1:573456225416:web:8e266a8802e4baaf94bb3d",
      measurementId: "G-SPZR44XBHD"
    };

  // Expose Firebase pour app.js
  window._fb = {};
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Promise résolue dès que l’auth anonyme est prête
  window._fb.db = db;
  window._fb.authReady = new Promise((resolve, reject) => {
    signInAnonymously(auth).catch((e) => {
      console.error('[Auth] signInAnonymously error:', e);
      reject(e);
    });
    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log('[Auth] Anonymous signed in:', user.uid);
        resolve(user);
      }
    }, (e) => {
      console.error('[Auth] onAuthStateChanged error:', e);
      reject(e);
    });
  });

  console.log('[Firebase] initialized');
</script>
  <script src="app.js"></script>

  
<!-- Modal de confirmation AVANT l'enregistrement -->
<div id="preConfirmModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="preConfirmTitle" style="display:none;">
  <div class="modal-card">
    <button id="preConfirmClose" class="modal-close" aria-label="Fermer">×</button>
    <h3 id="preConfirmTitle" class="modal-title">تأكيد الحفظ</h3>
    <p id="preConfirmText" class="modal-text">…</p>

    <div class="modal-actions">
      <button id="preConfirmCancel" class="btn btn-secondary">إلغاء</button>
      <button id="preConfirmOk" class="btn btn-primary">تأكيد وحفظ</button>
    </div>
  </div>
</div>

</body>
</html>
